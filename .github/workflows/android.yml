name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # lets the workflow publish the APK as a GitHub Release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Copy offline libraries and fonts into www/vendor
        run: npm run vendor

      - name: Create the Android project
        run: npx cap add android

      - name: Generate launcher icons and splash from assets/
        run: npx capacitor-assets generate --android

      - name: Copy the web app into the Android project
        run: npx cap sync android

      - name: Set version (versionCode = build number, so each APK installs over the last)
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Use the same signing key for every build
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using the keystore from the KEYSTORE_BASE64 secret"
            echo "$KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          else
            cp signing/debug.keystore ~/.android/debug.keystore
          fi
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "doll-knit-1.0.${{ github.run_number }}.apk"

      - name: Upload the APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: doll-knit-1.0.${{ github.run_number }}
          path: doll-knit-*.apk

      - name: Publish a GitHub Release with the APK (easy to download on the tablet)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Doll knit 1.0.${{ github.run_number }}
          body: |
            Built from ${{ github.sha }}.
            Download the .apk below on your tablet or phone and open it to install (allow "install unknown apps" for your browser or Files app the first time).
          files: doll-knit-*.apk
